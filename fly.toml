app = "field-work-add"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/field_work.db"
  TZ = "Asia/Jerusalem"

[[mounts]]
  source = "data"
  destination = "/data"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = 10000
    grace_period = "5s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = 2000
